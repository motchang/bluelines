[package]
name = "bluelines"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Preview markdown, mermaid included, in a browser tab that reloads on save"
license = "MIT OR Apache-2.0"
repository = "https://github.com/motchang/bluelines"
readme = "README.md"
keywords = ["markdown", "preview", "mermaid", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = ["/src", "/assets", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE*"]

[[bin]]
name = "blueline"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
comrak = { version = "0.55", default-features = false }
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
libc = "0.2.191"
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.1.2", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# Leave debug symbols out of the shipped binary.
strip = true
