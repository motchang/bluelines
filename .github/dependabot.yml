version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
  # The browser assets embedded in the binary. A bump here only changes the
  # lockfile; the "Sync vendored assets" workflow regenerates assets/vendor on
  # the pull request.
  - package-ecosystem: "npm"
    directory: "/packaging/vendor"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      vendored-assets:
        patterns: ["*"]
